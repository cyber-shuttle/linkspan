# The next job after examples/checkpoint.yml: resume the payload from its snapshot under the same ref, pause it
# again ahead of the time limit, and shut Linkspan down once it ends.
#
#   linkspan --port 8080 --workflow examples/restore.yml
name: restore
tasks:
  - on: start
    steps:
      - name: Resume the payload
        action: checkpoint.resume
        params:
          ids: [payload]
  - on: SIGUSR1
    steps:
      - name: Pause before the time limit
        action: checkpoint.pause
        params:
          ids: [payload]

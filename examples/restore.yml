# The next job after examples/checkpoint.yml: resume the payload from its dump, checkpoint it again ahead of the
# time limit, and stop Linkspan once it ends. Set images_dir to the directory the checkpoint answered with.
#
#   linkspan --port 8080 --workflow examples/restore.yml
name: restore
tasks:
  - on: start
    steps:
      - name: Resume the payload
        action: checkpoint.resume
        params:
          ids: [payload]
  - on: SIGUSR1
    steps:
      - name: Pause before the time limit
        action: checkpoint.pause
        params:
          ids: [payload]

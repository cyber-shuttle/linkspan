# A workflow that exercises each kind of trigger against a local Linkspan. Run it, then verify each step:
#
#   ./linkspan --port 8080 --workflow examples/workflow.yml
#
# start: a line on stdout, then the Jupyter environment built under ~/.cybershuttle, minutes the first time.
# ready: once start is complete: a Jupyter server on /tmp, then the session list logged;
#        curl http://127.0.0.1:8080/api/v1/jupyter/sessions shows it running with its token.
# SIGUSR1: kill -USR1 <pid>, as Slurm's --signal would: a line on stdout.
# stop: Ctrl-C or SIGTERM: a line on stdout before anything is torn down, then exit 0.
name: jupyter
tasks:
  - on: start
    steps:
      - name: Announce
        action: shell.exec
        params:
          command: echo workflow started
      - name: Build the Jupyter environment
        action: jupyter.setup
  - on: ready
    steps:
      - name: Jupyter
        action: jupyter.sessions.start
        params:
          root_dir: /tmp
      - name: List sessions
        action: jupyter.sessions.select
  - on: SIGUSR1
    steps:
      - name: Checkpoint before the time limit
        action: shell.exec
        params:
          command: echo time limit near, checkpointing
  - on: stop
    steps:
      - name: Sync results
        action: shell.exec
        params:
          command: echo stopping, syncing results

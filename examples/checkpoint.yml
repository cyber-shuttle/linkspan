# A workflow that runs a payload as a process session, checkpoints it ahead of the time limit and stops Linkspan
# once it ends. Linux, with criu on PATH and the kernel allowing unprivileged dumps:
#
#   linkspan --port 8080 --workflow examples/checkpoint.yml
#
# start: the payload counts on stdout; curl http://127.0.0.1:8080/api/v1/checkpoint/sessions lists it with its pid.
# SIGUSR1: kill -USR1 <pid>, as sbatch --signal=USR1@60 would: the tree is dumped under
#          ~/.cybershuttle/checkpoints/<id>, the payload dies with it, and Linkspan stops as it would at the
#          payload's end. examples/restore.yml resumes it from that directory.
name: checkpoint
steps:
  - name: Run the payload
    action: checkpoint.sessions.start
    params:
      command: for i in $(seq 1 100); do echo $i; sleep 1; done
      stop_on_exit: true
  - name: Checkpoint before the time limit
    on: SIGUSR1
    action: checkpoint.dump

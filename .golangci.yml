version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - dupl
    - gocritic
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - wastedassign

  exclusions:
    # this whitelists known patterns from needing //nolint comments.
    rules:
      # Tests exec (G204, G702) their own fixtures and binary, write them executable (G306) and read them (G304).
      - path: _test\.go
        linters: [gosec]
        text: "G204|G304|G306|G702"
      # Reads the --workflow file (G304).
      - path: subsystems/workflow/workflow\.go
        linters: [gosec]
        text: "G304"
      # Runs a process session's command (G204).
      - path: internal/sessions/sessions\.go
        linters: [gosec]
        text: "G204"
      # Reads a path the kernel wrote to /proc/self/cgroup (G304, G703).
      - path: internal/metrics/metrics\.go
        linters: [gosec]
        text: "G304|G703"
      # Writes a fetched binary executable (G306).
      - path: internal/install/install\.go
        linters: [gosec]
        text: "G306"
      # Dials a port only once a running task is bound to it, and only on loopback (G704).
      - path: internal/forward/forward\.go
        linters: [gosec]
        text: "G704"
      # Runs the fetched devtunnel binary (G204).
      - path: internal/tunnel/tunnel\.go
        linters: [gosec]
        text: "G204"
      # Run the uv, python and ttyd binaries they installed, and $SHELL on a PTY (G204, G702).
      - path: subsystems/(jupyter/jupyter|terminal/terminal)\.go
        linters: [gosec]
        text: "G204|G702"
      # Runs the user's criu (G204, G702) and reads the snapshot file beside its images (G304).
      - path: subsystems/checkpoint/checkpoint\.go
        linters: [gosec]
        text: "G204|G304|G702"
      # Runs the command the authenticated client sends (G204, G702).
      - path: internal/sshd/sshd\.go
        linters: [gosec]
        text: "G204|G702"

formatters:
  enable:
    - gofmt

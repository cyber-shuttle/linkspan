name: Feature request
description: Propose a change to what Linkspan does
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do that Linkspan cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What Linkspan would do instead.
    validations:
      required: true
  - type: textarea
    id: consumer
    attributes:
      label: Caller
      description: Which client would use this. A new flag or route is an API change and needs one; see docs/COMPATIBILITY.md.
    validations:
      required: false

name: Bug report
description: Report something Linkspan does wrong
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what Linkspan did instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command line Linkspan was started with, and the request or workflow step that triggered it. Redact tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `linkspan --version`.
      placeholder: 0.17.4
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: Linux x86_64
    validations:
      required: true
  - type: input
    id: scheduler
    attributes:
      label: Scheduler
      description: The scheduler the job ran under, if any.
      placeholder: Slurm 24.05
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines Linkspan wrote to stdout or stderr. Redact tokens and keys.
      render: text
    validations:
      required: false

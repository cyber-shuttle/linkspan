name: Sync issue and PR status to project

on:
  issues:
    types: [closed, reopened]
  # pull_request_target, not pull_request: a fork PR cannot read ADD_TO_PROJECT_PAT
  # otherwise. No repository code is checked out or run here.
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft]

jobs:
  update-project:
    runs-on: ubuntu-latest
    steps:
      - name: Update project item status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const projectId = "PVT_kwDOBa9-UM4ApBgm";
            const statusFieldId = "PVTSSF_lADOBa9-UM4ApBgmzgggAKY";
            const statusOptions = {
              "Backlog": "558f5162",
              "Todo": "6b029af1",
              "In Progress": "2c5afb50",
              "In Review": "6c721920",
              "Blocked": "90d338b2",
              "Done": "21877bf4",
            };

            const pr = context.payload.pull_request;
            const subject = pr ?? context.payload.issue;
            const kind = pr ? "pullRequest" : "issue";

            // A closed-but-unmerged PR keeps whatever status it had; everything
            // else maps to one column.
            let targetStatus;
            if (pr) {
              if (pr.merged) targetStatus = "Done";
              else if (pr.state === "closed") return;
              else if (pr.draft) targetStatus = "In Progress";
              else targetStatus = "In Review";
            } else {
              targetStatus = subject.state === "closed" ? "Done" : "Backlog";
            }

            // Ask the subject for its own project items. Scanning the project
            // needs paging: it holds more items than one page returns, so
            // items(first: 100) silently skipped everything past the first page.
            const query = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                ${kind}(number: $number) {
                  projectItems(first: 20) { nodes { id project { id } } }
                }
              }
            }`;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: subject.number,
            });
            const items = result.repository[kind].projectItems.nodes;
            const item = items.find(n => n.project.id === projectId);
            if (!item) {
              console.log(`${kind} #${subject.number} is on ${items.length} project(s), none of them ${projectId}; skipping`);
              return;
            }

            const mutation = `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }`;
            await github.graphql(mutation, {
              projectId,
              itemId: item.id,
              fieldId: statusFieldId,
              optionId: statusOptions[targetStatus],
            });
            console.log(`Updated ${kind} #${subject.number} to ${targetStatus}`);

name: Sync issue status to project

on:
  issues:
    types: [closed, reopened]

jobs:
  update-project:
    runs-on: ubuntu-latest
    steps:
      - name: Update project item status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const issue = context.payload.issue;
            const projectId = "PVT_kwDOBa9-UM4ApBgm";
            const statusFieldId = "PVTSSF_lADOBa9-UM4ApBgmzgggAKY";
            const statusOptions = {
              "Backlog": "558f5162",
              "Todo": "6b029af1",
              "In Progress": "2c5afb50",
              "In Review": "6c721920",
              "Blocked": "90d338b2",
              "Done": "21877bf4",
            };

            let targetStatus;
            if (issue.state === "closed") {
              targetStatus = "Done";
            } else {
              // Reopened — move back to Backlog
              targetStatus = "Backlog";
            }

            // Ask the issue for its own project items. Scanning the project
            // needs paging: it holds more items than one page returns, so
            // items(first: 100) silently skipped everything past the first page.
            const query = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) {
                  projectItems(first: 20) { nodes { id project { id } } }
                }
              }
            }`;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: issue.number,
            });
            const items = result.repository.issue.projectItems.nodes;
            const item = items.find(n => n.project.id === projectId);
            if (!item) {
              console.log(`Issue #${issue.number} is on ${items.length} project(s), none of them ${projectId}; skipping`);
              return;
            }

            const mutation = `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }`;
            await github.graphql(mutation, {
              projectId,
              itemId: item.id,
              fieldId: statusFieldId,
              optionId: statusOptions[targetStatus],
            });
            console.log("Updated issue #" + issue.number + " to " + targetStatus);
